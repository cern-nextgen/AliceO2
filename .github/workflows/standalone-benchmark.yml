name: Standalone Benchmark

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  benchmark:
    runs-on: ${{ matrix.runner }}
    container: registry.cern.ch/alisw/slc9-gpu-builder@sha256:ea3443f9dfbc770e4b4bce0d1a9ecc0b7a7c16e9f76e416b796d170877220820
    strategy:
      fail-fast: false
      matrix:
        name: [cpu, nvidia-h100, nvidia-rtx6000, nvidia-l40s, amd-mi300x, amd-w7900]
        include:
          - name: cpu
            runner: cern-nextgen-highfreq-4c
            cmake_args: -DENABLE_CUDA=0 -DENABLE_HIP=0
            profiler_runs: 12
            standalone_runs: 42
            backend: "-c"
          - name: nvidia-h100
            runner: cern-nextgen-h100
            cmake_args: -DENABLE_CUDA=1 -DENABLE_HIP=0 -DCUDA_COMPUTETARGET=90
            profiler_runs: 12
            standalone_runs: 42
            backend: "-g"
          - name: nvidia-rtx6000
            runner: cern-nextgen-rtx6000
            cmake_args: -DENABLE_CUDA=1 -DENABLE_HIP=0 -DCUDA_COMPUTETARGET=120
            profiler_runs: 12
            standalone_runs: 42
            backend: "-g"
          - name: nvidia-l40s
            runner: cern-nextgen-l40s
            cmake_args: -DENABLE_CUDA=1 -DENABLE_HIP=0 -DCUDA_COMPUTETARGET=89
            profiler_runs: 12
            standalone_runs: 42
            backend: "-g"
          - name: amd-mi300x
            runner: cern-nextgen-mi300x
            cmake_args: -DENABLE_CUDA=0 -DENABLE_HIP=1 -DHIP_AMDGPUTARGET=gfx942
            profiler_runs: 12
            standalone_runs: 42
            backend: "-g"
          - name: amd-w7900
            runner: cern-nextgen-w7900
            cmake_args: -DENABLE_CUDA=0 -DENABLE_HIP=1 -DHIP_AMDGPUTARGET=gfx1100
            profiler_runs: 12
            standalone_runs: 42
            backend: "-g"
    env:
      WORK_DIR: /cvmfs/alice.cern.ch
      ALIBUILD_ARCH_PREFIX: el9-x86_64/Packages
      MODULEPATH: /cvmfs/alice.cern.ch/etc/toolchain/modulefiles/el9-x86_64:/cvmfs/alice.cern.ch/el9-x86_64/Modules/modulefiles
      STANDALONE_DIR: /root/standalone
      BENCHMARK_CSV: standalone_${{ matrix.name }}.csv
      WARMUP_RUNS: 2
      TIMING_CA: ./ca -e 50kHz ${{ matrix.backend }} --memSize 15000000000 --inputMemory 6000000000 --outputMemory 10000000000 --RTCenable --RTCcacheOutput --RTCoptSpecialCode --seed 0 --sync --runsInit 0 --PROCresetTimers 1 --PROCdebugMarkdown 1 # Add --runs 42 for benchmark runs, and --debug 1 (plain benchmark) or --debug 0 (profiler runs)

    name: ${{ matrix.name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Files
        run: |
          mkdir -p ${STANDALONE_DIR}

          curl -fL --retry 3 -o ${STANDALONE_DIR}/o2-simple-GPU.out https://cernbox.cern.ch/remote.php/dav/public-files/SfYXgQOHFga2w75/o2-simple-GPU.out

          mkdir -p ${STANDALONE_DIR}/events
          curl -fL --retry 3 -o ${STANDALONE_DIR}/events/o2-simple.tar.xz https://cernbox.cern.ch/remote.php/dav/public-files/SfYXgQOHFga2w75/events/o2-simple.tar.xz
          tar -xf ${STANDALONE_DIR}/events/o2-simple.tar.xz -C ${STANDALONE_DIR}/events

          curl -fL --retry 3 -o ${STANDALONE_DIR}/events/50kHz.tar.xz https://cernbox.cern.ch/remote.php/dav/public-files/SfYXgQOHFga2w75/events/50kHz.tar.xz
          tar -xf ${STANDALONE_DIR}/events/50kHz.tar.xz -C ${STANDALONE_DIR}/events

      - name: Build Deterministic
        run: &build |
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25

          mkdir -p ${STANDALONE_DIR}
          cmake -B ${STANDALONE_DIR}/build ${{ matrix.cmake_args }} -DGPUCA_DETERMINISTIC_MODE=${DETERMINISTIC_MODE} -DCMAKE_INSTALL_PREFIX=${STANDALONE_DIR} ${GITHUB_WORKSPACE}/GPU/GPUTracking/Standalone/
          cmake --build ${STANDALONE_DIR}/build --target install -j 8
        env:
          DETERMINISTIC_MODE: GPU

      - name: Test Track Reconstruction
        run: |
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          cd ${STANDALONE_DIR}
          ${STANDALONE_DIR}/ca -e o2-simple ${{ matrix.backend }} --memSize 20500000000 --seed 0 --sync --runsInit 0 --runs 1 --RTCenable --PROCdeterministicGPUReconstruction 1 --RTCoptConstexpr 1 --RTCoptSpecialCode 1 --debug 6
          cmp ${STANDALONE_DIR}/*.out
          rm -rf ${STANDALONE_DIR}/*.out ${STANDALONE_DIR}/events/o2-simple ${STANDALONE_DIR}/build

      - name: Build Non-Deterministic
        run: *build
        env:
          DETERMINISTIC_MODE: OFF

      - name: Benchmark Track Reconstruction
        run: |
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          cd ${STANDALONE_DIR}
          ${TIMING_CA} --runs $(( ${{ matrix.standalone_runs }} + WARMUP_RUNS )) --debug 1 --PROCdebugCSV /root/${BENCHMARK_CSV}
          python3 ${GITHUB_WORKSPACE}/.github/scripts/profiler_standalone.py --discard ${WARMUP_RUNS} --input /root/${BENCHMARK_CSV} --output /root/summary_${BENCHMARK_CSV}

      - name: Profiler - Nsight Compute
        if: ${{ matrix.name == 'nvidia-h100' || matrix.name == 'nvidia-rtx6000' || matrix.name == 'nvidia-l40s' }}
        run: |
          dnf install -y cuda-nsight-compute-13-1
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          cd ${STANDALONE_DIR}
          ncu --set none --metrics gpu__time_duration.avg --export /root/${{ matrix.name }} --clock-control none --force-overwrite ${TIMING_CA} --runs ${{ matrix.profiler_runs }} --debug 0  # Generates /root/${{ matrix.name }}.ncu-rep
          rm -rf ${STANDALONE_DIR}/events/50kHz ${STANDALONE_DIR}/build

      - name: Profiler - Nsight Systems
        if: ${{ matrix.name == 'nvidia-h100' || matrix.name == 'nvidia-rtx6000' || matrix.name == 'nvidia-l40s' }}
        run: |
          dnf config-manager --add-repo "https://developer.download.nvidia.com/devtools/repos/rhel$(source /etc/os-release; echo ${VERSION_ID%%.*})/$(rpm --eval '%{_arch}' | sed s/aarch/arm/)/"
          dnf install --nogpgcheck -y nsight-systems-cli-2026.2.1
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          cd ${STANDALONE_DIR}
          nsys profile -o /root/${{ matrix.name }} ${TIMING_CA} --runs ${{ matrix.profiler_runs }} --debug 0  # Generates /root/${{ matrix.name }}.nsys-rep
          rm -rf ${STANDALONE_DIR}/events/50kHz ${STANDALONE_DIR}/build

      - name: Profiler - rocprofv3
        if: ${{ matrix.name == 'amd-mi300x' || matrix.name == 'amd-w7900' }}
        run: |
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          cd ${STANDALONE_DIR}
          rocprofv3 --kernel-trace --stats --output-format csv pftrace -d /root -o ${{ matrix.name }} -- ${TIMING_CA} --runs ${{ matrix.profiler_runs }} --debug 0  # Generates /root/${{ matrix.name }}* .csv and .pftrace
          rm -rf ${STANDALONE_DIR}/events/50kHz ${STANDALONE_DIR}/build

      - name: Profiler - perf
        if: ${{ matrix.name == 'cpu' }}
        run: |
          dnf install -y perf
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          cd ${STANDALONE_DIR}
          perf record -g -o /root/${{ matrix.name }}.perf.data -- ${TIMING_CA} --runs ${{ matrix.profiler_runs }} --debug 0
          rm -rf ${STANDALONE_DIR}/events/50kHz ${STANDALONE_DIR}/build

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-artifact
          path: |
            /root/*.csv
            /root/*.ncu-rep
            /root/*.nsys-rep
            /root/*.pftrace
            /root/*.perf.data

      - name: Display table on GitHub web
        run: |
          source /etc/profile.d/modules.sh
          module load ninja/fortran-v1.11.1.g9-15 Vc/1.4.5-10 boost/v1.83.0-alice2-57 fmt/11.1.2-14 CMake/v3.31.6-10 ms_gsl/4.2.1-3 Clang/v20.1.7-9 TBB/v2022.3.0-3 ROOT/v6-36-04-alice9-15 ONNXRuntime/v1.22.0-71 GLFW/3.3.2-25
          mkdir -p ${STANDALONE_DIR}/baseline
          rm -f ${STANDALONE_DIR}/baseline/summary_${BENCHMARK_CSV}
          curl -fL --retry 3 -o ${STANDALONE_DIR}/baseline/summary_${BENCHMARK_CSV} https://cernbox.cern.ch/remote.php/dav/public-files/SfYXgQOHFga2w75/baseline/summary_${BENCHMARK_CSV} || true
          if [ -s ${STANDALONE_DIR}/baseline/summary_${BENCHMARK_CSV} ]; then
            python3 ${GITHUB_WORKSPACE}/.github/scripts/csv_to_md.py --runs ${{ matrix.standalone_runs }} --baseline ${STANDALONE_DIR}/baseline/summary_${BENCHMARK_CSV} --current /root/summary_${BENCHMARK_CSV} >> ${GITHUB_STEP_SUMMARY}
          else
            echo "No baseline found for ${{ matrix.name }}, skipping comparison table." >> ${GITHUB_STEP_SUMMARY}
          fi
          rm -rf ${STANDALONE_DIR}/baseline