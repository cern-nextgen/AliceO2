name: Check Commits

# Proof of concept: workflow_dispatch can't be manually triggered from a non-default
# branch (GitHub platform restriction, not fixable from workflow config), so this is
# triggered by pushing a tag matching check-commits-*, e.g.:
#   git tag check-commits-$(date +%s) && git push origin check-commits-$(date +%s)
# n is hardcoded for now instead of taken as an input.
on:
  push:
    tags:
      - 'check-commits-*'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ngt-ci-pipeline
      N: 10
    steps:
      - name: Report broken pushes
        shell: bash
        run: |
          gh run list --repo ${{ github.repository }} --workflow=standalone-benchmark.yml \
            --branch "$BRANCH" --status completed --limit "$N" \
            --json headSha,displayTitle,conclusion \
            --jq '.[] | select(.conclusion != "success") | [.headSha,.displayTitle] | @tsv' > broken.tsv

          echo "## Broken pushes (last $N)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s broken.tsv ]; then
            echo "| Commit | Message |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r sha title; do
              echo "| [${sha:0:7}](https://github.com/${{ github.repository }}/commit/$sha) | ${title//|/\\|} |" >> "$GITHUB_STEP_SUMMARY"
            done < broken.tsv
          else
            echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi
