name: Check Commits

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Number of most recent pushes to check'
        required: true
        default: '10'

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate n
        shell: bash
        run: |
          if ! [[ "${{ inputs.n }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "n must be a positive integer, got '${{ inputs.n }}'" >&2
            exit 1
          fi

      - name: Report broken pushes
        shell: bash
        run: |
          gh run list --repo ${{ github.repository }} --workflow=standalone-benchmark.yml \
            --branch ${{ github.ref_name }} --status completed --limit ${{ inputs.n }} \
            --json headSha,displayTitle,conclusion \
            --jq '.[] | select(.conclusion != "success") | [.headSha,.displayTitle] | @tsv' > broken.tsv

          echo "## Broken pushes (last ${{ inputs.n }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -s broken.tsv ]; then
            echo "| Commit | Message |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r sha title; do
              echo "| [${sha:0:7}](https://github.com/${{ github.repository }}/commit/$sha) | ${title//|/\\|} |" >> "$GITHUB_STEP_SUMMARY"
            done < broken.tsv
          else
            echo "None." >> "$GITHUB_STEP_SUMMARY"
          fi
