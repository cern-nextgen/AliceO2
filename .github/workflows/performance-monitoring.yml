name: Performance Monitoring

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      n:
        description: 'Number of most recent pushes to include'
        required: true
        default: '10'
      platform:
        description: 'Matrix platform to plot'
        required: true
        type: choice
        options:
          - cpu
          - nvidia-h100
          - nvidia-rtx6000
          - nvidia-l40s
          - amd-mi300x
          - amd-w7900

permissions:
  contents: read
  actions: read

jobs:
  plot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate n
        shell: bash
        run: |
          if ! [[ "${{ inputs.n }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "n must be a positive integer, got '${{ inputs.n }}'" >&2
            exit 1
          fi

      - name: Install plotting dependencies
        shell: bash
        run: pip install --quiet matplotlib

      - name: Build plot.csv from the last n pushes
        shell: bash
        run: |
          echo "push,mean_us,stdev_us" > plot.csv

          gh run list --repo ${{ github.repository }} --workflow=standalone-benchmark.yml \
            --branch ${{ github.ref_name }} --status completed --limit ${{ inputs.n }} \
            --json databaseId,headSha \
            --jq '.[] | [.databaseId,.headSha] | @tsv' > runs.tsv

          found=$(wc -l < runs.tsv)
          if [ "$found" -lt "${{ inputs.n }}" ]; then
            echo "::warning::Only found $found completed run(s) of standalone-benchmark.yml on branch ${{ github.ref_name }}, requested ${{ inputs.n }}"
          fi

          tac runs.tsv | while IFS=$'\t' read -r runid sha; do
            dest="push_${sha:0:7}"
            mkdir -p "$dest"
            if ! gh run download "$runid" --repo ${{ github.repository }} -D "$dest" -n "${{ inputs.platform }}-artifact" 2>/dev/null; then
              echo "::warning::No ${{ inputs.platform }}-artifact for run $runid ($sha) -- ignoring push"
              continue
            fi

            wall=$(awk -F, '$1=="Wall"{print $2","$3}' "$dest/summary_standalone_${{ inputs.platform }}.csv" 2>/dev/null)
            if [ -z "$wall" ]; then
              echo "::warning::No Wall row in summary_standalone_${{ inputs.platform }}.csv for run $runid ($sha) -- ignoring push"
              continue
            fi

            echo "${sha:0:7},$wall" >> plot.csv
          done

      - name: Plot Wall time
        shell: bash
        run: python3 .github/scripts/performance_monitoring.py --input plot.csv --output plot.png

      - name: Add plot to job summary
        shell: bash
        run: echo "![Wall time](data:image/png;base64,$(base64 -w0 plot.png))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: performance-monitoring-${{ inputs.platform }}
          path: |
            plot.csv
            plot.png
