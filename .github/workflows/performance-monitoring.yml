name: Performance Monitoring

on:
  push:
    branches:
      - 'performance-monitoring'

permissions:
  contents: read
  actions: read

jobs:
  plot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ngt-ci-pipeline
      N: 10
      PLATFORM: nvidia-h100
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install plotting dependencies
        shell: bash
        run: pip install --quiet matplotlib

      - name: Build plot.csv from the last n pushes
        shell: bash
        run: |
          echo "push,mean_us,stdev_us" > plot.csv

          gh run list --repo ${{ github.repository }} --workflow=standalone-benchmark.yml \
            --branch "$BRANCH" --status completed --limit "$N" \
            --json databaseId,headSha \
            --jq '.[] | [.databaseId,.headSha] | @tsv' > runs.tsv

          found=$(wc -l < runs.tsv)
          if [ "$found" -lt "$N" ]; then
            echo "::warning::Only found $found completed run(s) of standalone-benchmark.yml on branch $BRANCH, requested $N"
          fi

          tac runs.tsv | while IFS=$'\t' read -r runid sha; do
            dest="push_${sha:0:7}"
            mkdir -p "$dest"
            if ! gh run download "$runid" --repo ${{ github.repository }} -D "$dest" -n "${PLATFORM}-artifact" 2>/dev/null; then
              echo "::warning::No ${PLATFORM}-artifact for run $runid ($sha) -- ignoring push"
              continue
            fi

            wall=$(awk -F, '$1=="Wall"{print $2","$3}' "$dest/summary_standalone_${PLATFORM}.csv" 2>/dev/null)
            if [ -z "$wall" ]; then
              echo "::warning::No Wall row in summary_standalone_${PLATFORM}.csv for run $runid ($sha) -- ignoring push"
              continue
            fi

            echo "${sha:0:7},$wall" >> plot.csv
          done

      - name: Plot Wall time
        shell: bash
        run: python3 .github/scripts/performance_monitoring.py --input plot.csv --output plot.png

      - name: Add plot to job summary
        shell: bash
        run: echo "![Wall time](data:image/png;base64,$(base64 -w0 plot.png))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: performance-monitoring-${{ env.PLATFORM }}
          path: |
            plot.csv
            plot.png
